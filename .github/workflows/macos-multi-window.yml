name: macOS Multi-Window Preview

on:
  push:
    branches: ['codex/macos-multi-window-preview']
  pull_request:
    branches: ['farna/main']
    paths:
      - 'platform/macos/**'
      - 'tests/platform/macos/**'
      - 'src/application/**'
      - 'src/runtime/**'
      - 'include/huxerui/**'
      - 'cmake/**'
      - '.github/workflows/macos-multi-window.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-multi-window-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appkit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            linkage: static
          - runner: macos-15-intel
            linkage: shared
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DHUXERUI_BUILD_STATIC=${{ matrix.linkage == 'static' && 'ON' || 'OFF' }} \
            -DHUXERUI_BUILD_SHARED=${{ matrix.linkage == 'shared' && 'ON' || 'OFF' }} \
            -DHUXERUI_BUILD_EXAMPLES=ON -DHUXERUI_BUILD_TESTS=ON \
            -DHUXERUI_BUILD_TESTING_LIBRARY=ON -DHUXERUI_BUILD_CLI=OFF
      - name: Build framework, suites, examples, and standalone headers
        run: |
          cmake --build build --parallel 3 --target \
            huxerui_unit_tests huxerui_runtime_tests huxerui_ui_tests huxerui_library_tests \
            huxerui_codegen_tests huxerui_codegen_runtime_tests huxerui_macos_tests \
            huxerui_macos_native_tests huxerui_header_checks huxerui_macos_header_checks \
            example_multi_window example_window_relationship
      - name: Common and codegen suites
        run: |
          ctest --test-dir build --output-on-failure -L common
          ctest --test-dir build --output-on-failure -R '^HuxerUICodegen(Tests|RuntimeTests)$'
      - name: AppKit platform suites
        run: ctest --test-dir build --output-on-failure -R '^HuxerUIMacOS(Tests|NativeTests)$'
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-multi-window-${{ matrix.runner }}-${{ matrix.linkage }}
          path: build/Testing/Temporary/
